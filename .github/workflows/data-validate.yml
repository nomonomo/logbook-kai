# data/ 配下の変更時に logbook-data + gamedata テストで検証する（logbook-bin / フル配布ビルドは行わない）
name: Data Validate

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
      - 'logbook-data/**'
      - 'logbook/src/test/java/logbook/internal/gamedata/**'
  # master 向けだけ。develop 等は push の結果が Checks に付く
  pull_request:
    branches: [master]
    paths:
      - 'data/**'
      - 'logbook-data/**'
      - 'logbook/src/test/java/logbook/internal/gamedata/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify-gamedata:
    name: Verify Game Data
    # 同一リポジトリの push / workflow_dispatch / pull request だけ実行する。
    # head.repo.fork はリポジトリ自体が fork だと常に true になるため使わない。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: 'false'
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: quests 生成・manifest 整合・gamedata 正当化テスト
        shell: bash
        run: |
          ./mvnw -pl logbook-data,logbook -am --batch-mode verify \
            -Pgamedata-update
      - name: data/ がツール出力と一致していること
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- data/)" ]; then
            echo "::error::data/ に未コミット差分があります。ローカルで -Pgamedata-update を実行し、結果をコミットしてください"
            git --no-pager status --porcelain -- data/
            git --no-pager diff -- data/
            exit 1
          fi
