# ImageListener 対象（配布ビルド）
#
# /kcs2/img/{category}/ の category 一覧。
# 形式: img.category.<n>=<name>（n は整数。欠番可。重複番号は警告して片方のみ採用）
# 艦娘画像（/kcs2/resources/ship/）は常に対象（本ファイル外）。
# 出撃マップ（/kcs2/resources/map/）は API キャプチャで扱う（本リスナー対象外）。
#
# 開発用: dev/image-listener.properties（mvn -Pdev package で同梱）

img.category.1=common
img.category.2=duty
img.category.3=sally
